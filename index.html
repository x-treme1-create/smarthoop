<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartHoop</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
  :root{
    --chalk:#F7F3EA; --ink:#2A2823; --slate:#4B5568;
    --red:#B23A3F; --gold:#A6874A; --teal:#2E9C90;
    --card:#FFFFFF; --line:#E6DECB; --muted:#948C77;
    --green:#2D7A4F;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--chalk);font-family:'Inter',system-ui,sans-serif;color:var(--ink);
    min-height:100vh;padding:env(safe-area-inset-top) 0 calc(80px + env(safe-area-inset-bottom));
    max-width:520px;margin:0 auto;}

  header{padding:16px 20px 10px;display:flex;align-items:center;justify-content:space-between;}
  .wordmark{font-family:'Poppins',sans-serif;font-weight:800;font-style:italic;font-size:13px;
    letter-spacing:.05em;color:var(--ink);}
  .wordmark b{color:var(--gold);}
  .sensor-btn{font-family:'Inter',sans-serif;font-weight:700;font-size:12px;
    background:var(--card);border:1px solid var(--line);border-radius:20px;padding:7px 14px;
    cursor:pointer;color:var(--ink);}
  .sensor-btn.on{background:var(--teal);color:#fff;border-color:var(--teal);}

  .navbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;
    background:var(--card);border-top:1px solid var(--line);display:flex;
    padding-bottom:env(safe-area-inset-bottom);}
  .navitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:10px 4px;border:none;background:none;cursor:pointer;font-family:'Inter',sans-serif;
    color:var(--muted);font-size:10px;font-weight:600;}
  .navitem.on{color:var(--red);}
  .navitem svg{width:22px;height:22px;}

  .screen{display:none;padding:0 20px 20px;}
  .screen.active{display:block;}

  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--red);margin:0 0 3px;}
  h2{font-family:'Poppins',sans-serif;font-size:22px;font-weight:700;margin:0 0 14px;
    letter-spacing:-.01em;}

  .statusline{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;
    color:var(--muted);margin-bottom:12px;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0;}
  .statusline.on{color:var(--teal);} .statusline.on .dot{background:var(--teal);}
  .statusline.rec{color:var(--red);} .statusline.rec .dot{background:var(--red);animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

  .ringwrap{display:flex;justify-content:center;margin-bottom:6px;}
  .ring{width:230px;height:230px;border-radius:50%;position:relative;
    background:conic-gradient(var(--red) 0deg, var(--line) 0deg);
    display:flex;align-items:center;justify-content:center;transition:background .2s;}
  .ring::before{content:'';position:absolute;inset:15px;border-radius:50%;background:var(--chalk);}
  .ring-in{position:relative;z-index:2;text-align:center;}
  .ring-in .num{font-family:'Poppins',sans-serif;font-size:56px;font-weight:700;line-height:1;
    font-variant-numeric:tabular-nums;}
  .ring-in .lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);margin-top:4px;}

  .dirline{text-align:center;font-family:'Poppins',sans-serif;font-weight:700;font-size:20px;
    margin:8px 0 12px;min-height:26px;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;}
  .tile .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
  .tile .v{font-family:'Poppins',sans-serif;font-size:22px;font-weight:700;margin-top:2px;
    font-variant-numeric:tabular-nums;}
  .v.teal{color:var(--teal);} .v.red{color:var(--red);} .v.gold{color:var(--gold);}

  .pausebanner{background:var(--slate);color:#fff;border-radius:16px;padding:11px 14px;
    margin-bottom:10px;font-weight:700;font-size:13px;display:none;}
  .pausebanner.show{display:block;}

  .btnrow{display:flex;gap:10px;margin-bottom:8px;}
  .btn{flex:1;border:none;border-radius:14px;padding:15px;font-size:15px;font-weight:700;
    font-family:'Inter',sans-serif;cursor:pointer;}
  .btn.primary{background:var(--green);color:#fff;}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);}
  .btn:disabled{opacity:.4;cursor:default;}

  .raw{font-size:10px;color:var(--muted);text-align:center;margin-top:8px;
    font-family:ui-monospace,Menlo,monospace;word-break:break-all;min-height:14px;}

  /* ── Zusammenfassung (Modal) ── */
  .overlay{position:fixed;inset:0;background:rgba(42,40,35,.6);z-index:100;
    display:none;align-items:flex-end;justify-content:center;}
  .overlay.show{display:flex;}
  .modal{background:var(--chalk);border-radius:28px 28px 0 0;padding:24px 24px calc(24px + env(safe-area-inset-bottom));
    width:100%;max-width:520px;max-height:90vh;overflow-y:auto;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .modal-head h3{font-family:'Poppins',sans-serif;font-size:20px;font-weight:700;margin:0;}
  .modal-close{border:none;background:var(--line);border-radius:50%;width:32px;height:32px;
    font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
  .sum-item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;}
  .sum-item .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
  .sum-item .v{font-family:'Poppins',sans-serif;font-size:24px;font-weight:700;margin-top:4px;}

  /* ── Verlauf ── */
  .sesscard{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;}
  .sesscard:active{opacity:.8;}
  .sess-ring{width:48px;height:48px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;}
  .sess-ring b{width:34px;height:34px;border-radius:50%;background:var(--chalk);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
  .sess-meta{flex:1;}
  .sess-meta .d{font-weight:700;font-size:13px;}
  .sess-meta .t{font-size:11px;color:var(--muted);margin-top:2px;}
  .sess-arr{color:var(--muted);font-size:18px;}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:40px 0;}
</style>
</head>
<body>

<header>
  <div class="wordmark">HOOP<b>YOUR</b>BODY<br>
    <svg width="110" height="9" viewBox="0 0 110 9"><path d="M1 3 Q55 13 109 1" stroke="#B23A3F" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
  </div>
  <button class="sensor-btn" id="btnConnect">Sensor verbinden</button>
</header>

<!-- TRAINING -->
<div class="screen active" id="s-training">
  <p class="eyebrow">Live-Training</p>
  <h2 id="trainHead">Bereit?</h2>
  <div class="statusline" id="status"><span class="dot"></span><span id="statusText">Sensor nicht verbunden</span></div>
  <div class="pausebanner" id="pauseBanner">⏸ Pause</div>
  <div class="ringwrap">
    <div class="ring" id="ring">
      <div class="ring-in">
        <div class="num" id="vRev">0</div>
        <div class="lbl">Umdrehungen</div>
      </div>
    </div>
  </div>
  <div class="dirline" id="vDir">&mdash;</div>
  <div class="grid">
    <div class="tile"><div class="k">Tempo</div><div class="v teal" id="vRpm">0,0 U/min</div></div>
    <div class="tile"><div class="k">Trainingszeit</div><div class="v" id="vTime">0:00</div></div>
    <div class="tile"><div class="k">Hüftschwünge</div><div class="v" id="vSw">0</div></div>
    <div class="tile"><div class="k">Kraft</div><div class="v gold" id="vForce">0,0 N</div></div>
    <div class="tile"><div class="k">Pausen</div><div class="v red" id="vPauses">0</div></div>
    <div class="tile"><div class="k">Ø Tempo</div><div class="v" id="vAvg">0,0 U/min</div></div>
  </div>
  <div class="btnrow">
    <button class="btn primary" id="btnStart" disabled>▶ Starten</button>
    <button class="btn ghost" id="btnStop" disabled>■ Beenden</button>
  </div>
  <div class="raw" id="raw"></div>
</div>

<!-- VERLAUF -->
<div class="screen" id="s-verlauf">
  <p class="eyebrow">Auswertung</p>
  <h2>Dein Verlauf</h2>
  <div id="verlaufList"></div>
</div>

<!-- MODAL: Session-Details -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">Session</h3>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="sum-grid" id="modalGrid"></div>
    <div class="btnrow">
      <button class="btn ghost" id="modalCloseBtn">Schließen</button>
    </div>
  </div>
</div>

<nav class="navbar">
  <button class="navitem on" data-target="s-training">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
    Training
  </button>
  <button class="navitem" data-target="s-verlauf">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
    Verlauf
  </button>
</nav>

<script>
(function(){
var SERVICE='19b10000-e8f2-537e-4f6c-d104768a1214';
var CHAR   ='19b10001-e8f2-537e-4f6c-d104768a1214';

var device=null, connected=false, sessionActive=false, isPaused=false;
var offRev=0, offSw=0, offPause=0;
var lastRaw={rev:0, sw:0, pauses:0};
var seconds=0, timerInterval=null, rpmSum=0, rpmCount=0;

var history=[];
try{ history=JSON.parse(localStorage.getItem('smarthoop_h')||'[]'); }catch(e){}

function $(id){ return document.getElementById(id); }
function num(v,d){ return v.toFixed(d).replace('.',','); }
function fmtTime(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function fmtDate(ts){
  var d=new Date(ts);
  return d.toLocaleDateString('de-AT',{weekday:'short',day:'numeric',month:'short'})+
    ' · '+d.toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'});
}

function setStatus(t,m){
  $('statusText').textContent=t;
  $('status').className='statusline'+(m?' '+m:'');
}

// Nav
document.querySelectorAll('.navitem').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.navitem').forEach(function(b){b.classList.remove('on');});
    document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
    btn.classList.add('on');
    $(btn.dataset.target).classList.add('active');
    if(btn.dataset.target==='s-verlauf') renderVerlauf();
  });
});

// Sensor
$('btnConnect').addEventListener('click',function(){
  connected ? disconnect() : connect();
});

async function connect(){
  if(!navigator.bluetooth){ setStatus('Kein Web Bluetooth',''); return; }
  try{
    setStatus('Suche…');
    device=await navigator.bluetooth.requestDevice({
      filters:[{namePrefix:'SmartHoop'}], optionalServices:[SERVICE]
    });
    device.addEventListener('gattserverdisconnected',onDisconnected);
    setStatus('Verbinde…');
    var s=await device.gatt.connect();
    var svc=await s.getPrimaryService(SERVICE);
    var ch=await svc.getCharacteristic(CHAR);
    await ch.startNotifications();
    ch.addEventListener('characteristicvaluechanged',onData);
    connected=true;
    $('btnConnect').textContent='Sensor trennen';
    $('btnConnect').classList.add('on');
    $('btnStart').disabled=false;
    setStatus('Verbunden — bereit','on');
    $('trainHead').textContent='Bereit?';
  }catch(e){ setStatus('Verbindung fehlgeschlagen',''); console.error(e); }
}

function disconnect(){
  try{ if(device&&device.gatt.connected) device.gatt.disconnect(); }catch(e){}
  onDisconnected();
}

function onDisconnected(){
  connected=false;
  $('btnConnect').textContent='Sensor verbinden';
  $('btnConnect').classList.remove('on');
  $('btnStart').disabled=true;
  $('btnStop').disabled=true;
  setStatus('Sensor nicht verbunden','');
  if(sessionActive) stopSession(true);
}

// Session
$('btnStart').addEventListener('click',function(){
  if(!sessionActive) startSession();
});
$('btnStop').addEventListener('click',function(){
  if(sessionActive) stopSession(false);
});

function startSession(){
  sessionActive=true;
  seconds=0; rpmSum=0; rpmCount=0;
  offRev=lastRaw.rev; offSw=lastRaw.sw; offPause=lastRaw.pauses;
  $('btnStart').disabled=true;
  $('btnStop').disabled=false;
  $('btnStart').textContent='▶ Läuft…';
  setStatus('Training läuft','rec');
  $('trainHead').textContent='Training läuft';
  ['vRev','vSw','vPauses','vAvg'].forEach(function(id){ $(id).textContent='0'; });
  $('vTime').textContent='0:00';
  $('vDir').innerHTML='&mdash;';
  $('ring').style.background='conic-gradient(var(--red) 0deg, var(--line) 0deg)';
  timerInterval=setInterval(function(){
    if(!isPaused) seconds++;
    $('vTime').textContent=fmtTime(seconds);
  },1000);
}

function stopSession(silent){
  if(!sessionActive) return;
  sessionActive=false;
  clearInterval(timerInterval);
  $('btnStart').disabled=false;
  $('btnStart').textContent='▶ Starten';
  $('btnStop').disabled=true;
  if(connected) setStatus('Verbunden — bereit','on');
  $('trainHead').textContent='Fertig!';
  if(!silent){
    var entry={
      ts:Date.now(),
      duration:seconds,
      rev:parseInt($('vRev').textContent)||0,
      sw:parseInt($('vSw').textContent)||0,
      pauses:parseInt($('vPauses').textContent)||0,
      avgRpm:rpmCount?rpmSum/rpmCount:0
    };
    history.unshift(entry);
    if(history.length>100) history.pop();
    try{ localStorage.setItem('smarthoop_h',JSON.stringify(history)); }catch(e){}
    openModal(entry);
  }
}

// Daten
function onData(ev){
  try{
    var text=new TextDecoder().decode(ev.target.value).trim();
    $('raw').textContent=text;
    var p=text.split(',');
    if(p.length<7) return;
    var rev=parseInt(p[0],10)||0;
    var dir=parseInt(p[1],10)||0;
    var deg=parseFloat(p[2])||0;
    var sw=parseInt(p[3],10)||0;
    var force=parseFloat(p[4])||0;
    var pause=p[5].trim()==='1';
    var pauses=parseInt(p[6],10)||0;
    lastRaw={rev:rev,sw:sw,pauses:pauses};
    isPaused=pause;
    if(!sessionActive) return;
    var rpm=Math.abs(deg)/6;
    $('vRev').textContent=Math.max(0,rev-offRev);
    $('vSw').textContent=Math.max(0,sw-offSw);
    $('vPauses').textContent=Math.max(0,pauses-offPause);
    $('vRpm').textContent=num(rpm,1)+' U/min';
    $('vForce').textContent=num(force,1)+' N';
    $('vDir').textContent=pause?'—':(dir>0?'→ rechts':(dir<0?'← links':'—'));
    $('pauseBanner').className='pausebanner'+(pause?' show':'');
    var d=Math.min(360,(rpm/90)*360);
    $('ring').style.background='conic-gradient(var(--red) '+d+'deg, var(--line) '+d+'deg)';
    if(!pause&&rpm>0){ rpmSum+=rpm; rpmCount++; }
    $('vAvg').textContent=num(rpmCount?rpmSum/rpmCount:0,1)+' U/min';
  }catch(e){ console.error(e); }
}

// Modal
function openModal(e){
  $('modalTitle').textContent='🏆 '+fmtDate(e.ts);
  $('modalGrid').innerHTML=
    '<div class="sum-item"><div class="k">Dauer</div><div class="v">'+fmtTime(e.duration)+'</div></div>'+
    '<div class="sum-item"><div class="k">Umdrehungen</div><div class="v teal">'+e.rev+'</div></div>'+
    '<div class="sum-item"><div class="k">Hüftschwünge</div><div class="v">'+e.sw+'</div></div>'+
    '<div class="sum-item"><div class="k">Pausen</div><div class="v red">'+e.pauses+'</div></div>'+
    '<div class="sum-item"><div class="k">Ø Tempo</div><div class="v gold">'+num(e.avgRpm,1)+' U/min</div></div>'+
    '<div class="sum-item"><div class="k">Aktive Zeit</div><div class="v">'+fmtTime(Math.max(0,e.duration-e.pauses*5))+'</div></div>';
  $('overlay').classList.add('show');
}

function closeModal(){
  $('overlay').classList.remove('show');
}
['click','touchend'].forEach(function(ev){
  $('modalClose').addEventListener(ev, function(e){e.preventDefault();closeModal();});
  $('modalCloseBtn').addEventListener(ev, function(e){e.preventDefault();closeModal();});
  $('overlay').addEventListener(ev, function(e){
    if(e.target===$('overlay')){e.preventDefault();closeModal();}
  });
});

// Verlauf
function renderVerlauf(){
  var el=$('verlaufList');
  if(!history.length){
    el.innerHTML='<div class="empty">Noch kein Training aufgezeichnet.<br>Starte dein erstes Training!</div>';
    return;
  }
  el.innerHTML=history.map(function(e,i){
    var pct=Math.min(360,Math.round((e.rev/100)*360));
    return '<div class="sesscard" data-i="'+i+'">'+
      '<div class="sess-ring" style="background:conic-gradient(var(--teal) 0deg '+pct+'deg, var(--line) '+pct+'deg 360deg)">'+
        '<b>'+e.rev+'</b></div>'+
      '<div class="sess-meta">'+
        '<div class="d">'+fmtDate(e.ts)+'</div>'+
        '<div class="t">'+fmtTime(e.duration)+' · '+e.sw+' Schwünge · '+num(e.avgRpm,1)+' U/min</div>'+
      '</div>'+
      '<span class="sess-arr">›</span></div>';
  }).join('');
  el.querySelectorAll('.sesscard').forEach(function(card){
    // click UND touchend für Bluefy/iOS
    function handleOpen(e){
      e.preventDefault();
      openModal(history[parseInt(card.dataset.i)]);
    }
    card.addEventListener('click', handleOpen);
    card.addEventListener('touchend', handleOpen);
  });
}

})();
</script>
</body>
</html>
